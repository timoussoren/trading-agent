name: Trading Agent

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:  # Allows manual trigger

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic yfinance

      - name: Run trading agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python trading_agent.py

      - name: Save updated portfolio
        run: |
          git config --global user.name "Trading Bot"
          git config --global user.email "bot@trading.com"
          git add portfolio.json
          git diff --staged --quiet || git commit -m "Portfolio update $(date +'%Y-%m-%d %H:%M')"
          git push

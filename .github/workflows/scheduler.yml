name: Trading Agent

on:
  schedule:
    - cron: '30 14 * * 1-5'  # 9:30 AM ET — market open
    - cron: '54 15 * * 1-5'  # 10:54 AM ET — late morning
    - cron: '18 17 * * 1-5'  # 12:18 PM ET — midday
    - cron: '42 18 * * 1-5'  # 1:42 PM ET — mid afternoon
    - cron: '0 20  * * 1-5'  # 3:00 PM ET — before close
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic yfinance pandas lxml html5lib beautifulsoup4

      - name: Run trading agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python trading_agent.py

      - name: Save updated portfolio
        run: |
          git config --global user.name "Trading Bot"
          git config --global user.email "bot@trading.com"
          git add portfolio.json
          git diff --staged --quiet || git commit -m "Portfolio update $(date +'%Y-%m-%d %H:%M')"
          git push

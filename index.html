<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trading Agent Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f3; color: #1a1a18; padding: 2rem; }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .metric { background: #ebebea; border-radius: 8px; padding: 1rem; }
    .metric-label { font-size: 13px; color: #888; margin-bottom: 4px; }
    .metric-value { font-size: 24px; font-weight: 500; }
    .metric-value.up { color: #1D9E75; }
    .metric-value.down { color: #E24B4A; }
    .card { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
    .section-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .slot { border-radius: 8px; padding: 10px 12px; border: 0.5px solid #ddd; display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .slot.done { background: #EAF3DE; border-color: #97C459; }
    .slot.next { background: #E6F1FB; border-color: #378ADD; }
    .slot.pending { background: #f5f5f3; }
    .slot-time { font-size: 13px; font-weight: 500; }
    .slot-time.done { color: #3B6D11; }
    .slot-time.next { color: #185FA5; }
    .slot-time.pending { color: #888; }
    .slot-badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; display: inline-block; width: fit-content; }
    .badge-done { background: #C0DD97; color: #27500A; }
    .badge-next { background: #B5D4F4; color: #0C447C; }
    .badge-pending { background: #e0e0de; color: #888; }
    .trade-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid rgba(0,0,0,0.08); font-size: 13px; }
    .trade-row:last-child { border-bottom: none; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
    .pill-buy { background: #EAF3DE; color: #3B6D11; }
    .pill-sell { background: #FCEBEB; color: #A32D2D; }
    @media (max-width: 600px) { .grid-4 { grid-template-columns: repeat(2,1fr); } .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
    <div>
      <h1>Trading agent dashboard</h1>
      <div class="sub" id="last-updated">Loading...</div>
    </div>
    <div style="font-size:12px; color:#888; text-align:right;" id="clock"></div>
  </div>

  <div class="section-label">Portfolio summary</div>
  <div class="grid-4">
    <div class="metric"><div class="metric-label">Total value</div><div class="metric-value" id="total-value">$1,000.00</div></div>
    <div class="metric"><div class="metric-label">Cash available</div><div class="metric-value" id="cash">$1,000.00</div></div>
    <div class="metric"><div class="metric-label">Invested</div><div class="metric-value" id="invested">$0.00</div></div>
    <div class="metric"><div class="metric-label">P&L</div><div class="metric-value" id="pnl">$0.00</div></div>
  </div>

  <div class="section-label">Portfolio value over time</div>
  <div class="card">
    <div style="position:relative; width:100%; height:220px;"><canvas id="valueChart"></canvas></div>
  </div>

  <div class="grid-2">
    <div>
      <div class="section-label">Today's run schedule (UTC)</div>
      <div id="schedule"></div>
    </div>
    <div>
      <div class="section-label">Current holdings</div>
      <div class="card" id="holdings-list" style="margin-bottom:0;">
        <div style="font-size:13px; color:#888;">No holdings yet</div>
      </div>
    </div>
  </div>

  <div class="section-label" style="margin-top:1.5rem;">Recent transactions</div>
  <div class="card" id="transactions">
    <div style="font-size:13px; color:#888;">No transactions yet</div>
  </div>

<script>
const PORTFOLIO_URL = "https://raw.githubusercontent.com/timoussoren/trading-agent/main/portfolio.json";
const SCHEDULE_HOURS = [0, 4, 8, 12, 16, 20];

function updateClock() {
  const now = new Date();
  document.getElementById('clock').innerHTML =
    now.toUTCString().replace(' GMT','') + ' UTC<br>Local: ' + now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

function buildSchedule() {
  const now = new Date();
  const nowH = now.getUTCHours() + now.getUTCMinutes() / 60;
  const container = document.getElementById('schedule');
  container.innerHTML = '';
  let foundNext = false;
  SCHEDULE_HOURS.forEach(h => {
    const label = h.toString().padStart(2,'0') + ':00 UTC';
    let state, badgeText;
    if (h < nowH - 0.1) { state = 'done'; badgeText = 'Completed'; }
    else if (!foundNext) { state = 'next'; badgeText = 'Next run'; foundNext = true; }
    else { state = 'pending'; badgeText = 'Pending'; }
    const slot = document.createElement('div');
    slot.className = 'slot ' + state;
    slot.innerHTML = `<div class="slot-time ${state}">${label}</div>
      <div class="slot-badge badge-${state === 'done' ? 'done' : state === 'next' ? 'next' : 'pending'}">${badgeText}</div>`;
    container.appendChild(slot);
  });
}

let chartInstance = null;
function buildChart(history) {
  const labels = history.map(t => {
    const d = new Date(t.timestamp);
    return d.toLocaleDateString('en-GB', {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  });
  const values = history.map(t => t.portfolio_value || 1000);
  if (labels.length === 0) { labels.push('Start'); values.push(1000); }
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('valueChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Portfolio value',
        data: values,
        borderColor: '#378ADD',
        backgroundColor: 'rgba(55,138,221,0.08)',
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: '#378ADD',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { ticks: { callback: v => '$' + v.toFixed(0) }, grid: { color: 'rgba(0,0,0,0.06)' } },
        x: { ticks: { maxRotation: 35, font: { size: 11 } }, grid: { display: false } }
      }
    }
  });
}

function renderHoldings(holdings) {
  const el = document.getElementById('holdings-list');
  const entries = Object.entries(holdings || {});
  if (!entries.length) { el.innerHTML = '<div style="font-size:13px;color:#888;">No holdings yet</div>'; return; }
  el.innerHTML = `
    <div class="trade-row" style="font-size:11px; color:#888; font-weight:500;">
      <span style="min-width:55px;">Symbol</span>
      <span style="min-width:50px;">Shares</span>
      <span style="min-width:65px;">Price</span>
      <span style="margin-left:auto;">Value</span>
    </div>` +
    entries.map(([sym, data]) => {
      const shares = typeof data === 'object' ? data.shares : data;
      const price = typeof data === 'object' ? '$' + data.price?.toFixed(2) : '—';
      const value = typeof data === 'object' ? '$' + data.value?.toFixed(2) : '—';
      return `<div class="trade-row">
        <span style="font-weight:500;min-width:55px;">${sym}</span>
        <span style="color:#888;min-width:50px;">${shares}</span>
        <span style="color:#888;min-width:65px;">${price}</span>
        <span style="margin-left:auto;font-weight:500;">${value}</span>
      </div>`;
    }).join('');
}

function renderTransactions(history) {
  const el = document.getElementById('transactions');
  if (!history || !history.length) { el.innerHTML = '<div style="font-size:13px;color:#888;">No transactions yet</div>'; return; }
  el.innerHTML = [...history].reverse().slice(0, 10).map(t => {
    const pill = t.action === 'buy' ? 'pill-buy' : 'pill-sell';
    const d = new Date(t.timestamp);
    const dateStr = d.toLocaleDateString('en-GB', {month:'short', day:'numeric'}) + ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    return `<div class="trade-row">
      <span class="pill ${pill}">${t.action}</span>
      <span style="font-weight:500;min-width:55px;">${t.symbol}</span>
      <span style="color:#888;">${t.shares} shares @ $${t.price?.toFixed(2)}</span>
      <span style="margin-left:auto;color:#888;font-size:12px;">${dateStr}</span>
    </div>`;
  }).join('');
}

async function loadPortfolio() {
  try {
    const res = await fetch(PORTFOLIO_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error();
    const data = await res.json();
    const cash = data.cash || 1000;
    const pnl = (data.total_value || cash) - 1000;
    const invested = (data.total_value || cash) - cash;
    document.getElementById('total-value').textContent = '$' + (data.total_value || cash).toFixed(2);
    document.getElementById('cash').textContent = '$' + cash.toFixed(2);
    document.getElementById('invested').textContent = '$' + invested.toFixed(2);
    const pnlEl = document.getElementById('pnl');
    pnlEl.textContent = (pnl >= 0 ? '+' : '') + '$' + pnl.toFixed(2);
    pnlEl.className = 'metric-value ' + (pnl > 0 ? 'up' : pnl < 0 ? 'down' : '');
    if (data.last_updated) {
      document.getElementById('last-updated').textContent = 'Last updated: ' + new Date(data.last_updated).toLocaleString();
    } else {
      document.getElementById('last-updated').textContent = 'Running — no cycles completed yet';
    }
    buildChart(data.transaction_history || []);
    renderHoldings(data.holdings || {});
    renderTransactions(data.transaction_history || []);
  } catch(e) {
    document.getElementById('last-updated').textContent = 'Could not load portfolio data';
    buildChart([]);
  }
  buildSchedule();
}

loadPortfolio();
setInterval(loadPortfolio, 60000);
setInterval(buildSchedule, 60000);
</script>
</body>
</html>
